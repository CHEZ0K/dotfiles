# ==============================================================================
# FOOT CONFIGURATION (Pixel-perfect match for Kitty)
# ==============================================================================

# --- ТЕМА И ЦВЕТА (Интеграция с pywal) ---
include=~/.cache/wal/colors-foot.ini

# --- ШРИФТЫ (1:1 JetBrainsMono Nerd Font 11pt) ---
font=JetBrainsMono Nerd Font:size=11
font-bold=JetBrainsMono Nerd Font:size=11:weight=bold
font-italic=JetBrainsMono Nerd Font:size=11:slant=italic
font-bold-italic=JetBrainsMono Nerd Font:size=11:weight=bold:slant=italic
pad=14x10 center

# 4 потока под 4 физических ядра Ryzen 3500U (минимум переключений контекста, максимум скорости)
workers=4

# --- КУРСОР (1:1 как в kitty.conf) ---
[cursor]
style=underline
unfocused-style=hollow
blink=no
underline-thickness=2px

# --- СКРОЛЛИНГ И ИСТОРИЯ (5000 строк, множитель 3.0, без скроллбара) ---
[scrollback]
lines=5000
multiplier=3.0
indicator-position=none

# --- ССЫЛКИ И МЫШЬ ---
[url]
launch=xdg-open ${url}
osc8-underline=url-mode

[mouse]
hide-when-typing=no
alternate-scroll-mode=yes

# --- ДЕКОРАЦИИ ОКНА (как hide_window_decorations yes в Kitty) ---
[csd]
preferred=none

# --- ЗВОНОК (Отключен как в Kitty) ---
[bell]
urgent=no
notify=no
visual=no

# --- ЦВЕТА, ЧЕРНЫЙ ФОН, ПРОЗРАЧНОСТЬ И РАЗМЫТИЕ ---
[colors-dark]
background=000000
alpha=0.40
blur=yes
urls=0087bd

# --- НИЗКОУРОВНЕВАЯ ОПТИМИЗАЦИЯ ПРОИЗВОДИТЕЛЬНОСТИ ---
[tweak]
# Виртуальный пул памяти под кольцевой буфер скролла (не расходует физическую RAM, ускоряет рендер)
max-shm-pool-size-mb=512
# Не перерисовывать всё окно целиком (перерисовывать только изменившиеся символы - экономия CPU и GPU)
damage-whole-window=no
# Предварительно применять изменения между кадрами (минимизирует memcpy)
pre-apply-damage=yes
