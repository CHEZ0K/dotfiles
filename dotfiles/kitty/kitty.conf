# ==============================================================================
# KITTY CONFIGURATION
# ==============================================================================

# --- ТЕМА И ЦВЕТА (Интеграция с обоями через pywal) ---
include ~/.cache/wal/colors-kitty.conf
background #000000

# --- ШРИФТЫ ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
disable_ligatures cursor

# --- КУРСОР ---
cursor_text_color            background
cursor_shape                 underline
cursor_shape_unfocused       hollow
cursor_blink_interval        0
cursor_trail                 1
cursor_trail_decay           0.1 0.35
cursor_trail_start_threshold 2
cursor_trail_color           none

# --- СКРОЛЛИНГ И ИСТОРИЯ ---
scrollback_lines                5000
scrollbar                       never
scrollback_fill_enlarged_window yes
wheel_scroll_multiplier         3.0
touch_scroll_multiplier         1.5

# --- МЫШЬ, ССЫЛКИ И ВЫДЕЛЕНИЕ ---
url_color                  #0087bd
url_style                  curly
detect_urls                yes
open_url_with              default
mouse_hide_wait            -1.0
clear_selection_on_clipboard_loss no
strip_trailing_spaces      always
focus_follows_mouse        yes

# Умный клик: клик по строке ввода перемещает курсор в место клика
mouse_map left click ungrabbed mouse_handle_click selection link prompt

# --- ОКНА, ОТСТУПЫ И РАЗМЫТИЕ ---
hide_window_decorations    yes
confirm_os_window_close    0
window_padding_width       10 14
placement_strategy         center

# Прозрачность и блюр
background_opacity         0.40
background_blur            1
dynamic_background_opacity yes

# --- СИСТЕМНЫЙ ЗВОНОК ---
enable_audio_bell          no
visual_bell_duration       0.0

# --- ПРОДВИНУТЫЕ НАСТРОЙКИ И ОБНОВЛЕНИЕ НА ЛЕТУ ---
auto_reload_config         0.1
allow_remote_control       yes
listen_on                  unix:/tmp/mykitty
shell_integration          enabled
